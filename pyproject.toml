[project]
name = "audio-journal-transcriber"
version = "0.2.8"
description = "Automated pipeline for transcribing and summarizing personal recordings."
authors = [{ name = "Kelno", email = "kelnowm@gmail.com" }]
requires-python = ">=3.13"

dependencies = [
  "requests",
  "pyyaml",
  "pydantic",
  "pydantic-settings",
  "coloredlogs",
  "openai",
  "pydub",
  "uv>=0.10.2",
  "watchdog>=6.0.0",
  "tzdata>=2026.2",
  "pytest>=9.0.3",
  "audioop-lts>=0.2.2",
]

[project.scripts]
# This creates a console command
transcriber = "transcriber.cli:main"

[tool.uv]
package = true
