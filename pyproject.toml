[project]
name = "audio-journal-transcriber"
version = "0.8.0"
description = "Automated pipeline for transcribing and summarizing personal recordings."
authors = [{ name = "Kelno", email = "kelnow@proton.me" }]
requires-python = ">=3.13"

dependencies = [
  "fastapi",
  "requests",
  "pyyaml",
  "pydantic",
  "pydantic-settings",
  "coloredlogs",
  "openai",
  "pydub",
  "uv>=0.11.29",
  "watchdog>=6.0.0",
  "tzdata>=2026.3",
  "uvicorn",
  "pytest>=9.1.1",
  "audioop-lts>=0.2.2",
]

[project.scripts]
# This creates a console command
transcriber = "transcriber.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pylint>=4.0.6",
    "ruff>=0.15.22",
]
